<!DOCTYPE html>
<!-- Vorlage für das Band-Image (assets/downloads/donkey-shorts-bandbild.jpg).
     Neu erzeugen mit: presse/build.sh -->
<html lang="de">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0c0c10; --text:#ecebf0; --dim:#a0a0b0; --accent:#ff3d6e; --accent-2:#ffb627; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1600px; height:900px; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; }

  .members { position:absolute; inset:0 0 250px 0; display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  .m { position:relative; overflow:hidden; }
  .m img { width:100%; height:100%; object-fit:cover; filter:grayscale(1) contrast(1.1) brightness(.9); }
  .m::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(12,12,16,0) 55%, rgba(12,12,16,.95) 100%); }
  .m .who { position:absolute; left:0; right:0; bottom:22px; text-align:center; z-index:1; }
  .m .name { font-family:'Bebas Neue',sans-serif; font-size:48px; line-height:1; letter-spacing:.03em; }
  .m .role { font-size:15px; font-weight:600; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-2); margin-top:4px; }

  .bar { position:absolute; left:0; right:0; bottom:0; height:250px; display:flex; align-items:center; gap:40px; padding:0 70px;
         background:var(--bg); border-top:6px solid; border-image:linear-gradient(90deg,var(--accent),var(--accent-2)) 1; }
  .bar img { width:200px; height:200px; border-radius:50%; }
  .title { font-family:'Bebas Neue',sans-serif; font-size:120px; line-height:.9; letter-spacing:.02em; }
  .grad { background:linear-gradient(120deg,var(--accent),var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { font-size:26px; color:var(--dim); margin-top:10px; }
  .url { margin-left:auto; text-align:right; font-size:24px; font-weight:600; line-height:1.6; }
  .url span { color:var(--accent-2); }
</style>
</head>
<body>
  <div class="members">
    <div class="m"><img src="../assets/fotos/Annie.jpg" style="object-position:50% 30%"><div class="who"><div class="name">Annie</div><div class="role">Lead Vocals</div></div></div>
    <div class="m"><img src="../assets/fotos/Rob.png"><div class="who"><div class="name">Rob</div><div class="role">Vocals · Akustik</div></div></div>
    <div class="m"><img src="../assets/fotos/Joe.jpg" style="object-position:5% 50%"><div class="who"><div class="name">Joe</div><div class="role">Leadgitarre</div></div></div>
    <div class="m"><img src="../assets/fotos/Klaus.jpg"><div class="who"><div class="name">Klaus</div><div class="role">Leadgitarre</div></div></div>
    <div class="m"><img src="../assets/fotos/Andy.jpg" style="object-position:35% 50%"><div class="who"><div class="name">Andy</div><div class="role">Bass</div></div></div>
    <div class="m"><img src="../assets/fotos/Thorsten.png" style="object-position:60% 50%"><div class="who"><div class="name">Torsten</div><div class="role">Drums</div></div></div>
  </div>

  <div class="bar">
    <img src="../assets/img/logo.png" alt="">
    <div>
      <div class="title">The <span class="grad">Donkey</span> Shorts</div>
      <div class="sub">Rock- &amp; Pop-Coverband aus Karlsruhe</div>
    </div>
    <div class="url"><span>donkey-shorts.com</span><br>info@donkey-shorts.com</div>
  </div>
</body>
</html>
